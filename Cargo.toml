[workspace]
resolver = "2"
members = [
    "crates/paint-core",
    "crates/paint-render",
    "crates/paint-desktop",
    "crates/paint-wasm",
    "crates/paint-android",
    "crates/paint-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
# 体积优先（wasm 产物从 4.13MB 降到 2.88MB）；native 构建如需速度可覆盖
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1

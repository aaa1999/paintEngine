[package]
name = "paint-wasm"
description = "Web 壳：canvas 呈现 + Pointer Events（含 pointerrawupdate）输入"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
paint-core = { path = "../paint-core" }
paint-render = { path = "../paint-render" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "EventTarget",
    "Event",
    "PointerEvent",
    "ResizeObserver",
    "DomRect",
    "WheelEvent",
    "KeyboardEvent",
    "Performance",
] }

[package]
name = "paint-wasm"
description = "Web 壳：canvas 呈现 + Pointer Events（含 pointerrawupdate）输入"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = { workspace = true }
paint-core = { path = "../paint-core", default-features = false }
paint-render = { path = "../paint-render" }
paint-gpu = { path = "../paint-gpu", optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "EventTarget",
    "Event",
    "PointerEvent",
    "ResizeObserver",
    "DomRect",
    "WheelEvent",
    "KeyboardEvent",
    "Performance",
] }

[dev-dependencies]
wasm-bindgen-test = "0.2"

[features]
default = ["svg", "text"]
core = []
svg = ["paint-core/svg"]
text = ["paint-core/text"]
gpu = ["dep:paint-gpu"]

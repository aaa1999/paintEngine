<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>paintEngine — Web</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, sans-serif; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px; background: #f3f3f3; border-bottom: 1px solid #ddd;
    }
    #toolbar button, #toolbar select, #toolbar input {
      font: inherit; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
      background: #fff; cursor: pointer;
    }
    #toolbar button.active { background: #1677ff; color: #fff; border-color: #1677ff; }
    #canvas { display: block; width: calc(100vw - 220px); height: calc(100vh - 45px); touch-action: none; float: left; }
    #layerPanel {
      width: 220px; height: calc(100vh - 45px); float: right;
      background: #2a2a2e; color: #eee; display: flex; flex-direction: column;
      font: 12px system-ui, sans-serif; overflow: hidden;
    }
    #layerHeader { padding: 8px 10px; font-weight: 600; background: #222; border-bottom: 1px solid #444; }
    #layerList { flex: 1; overflow-y: auto; padding: 4px; }
    .layerRow {
      display: flex; align-items: center; gap: 4px; padding: 4px 6px;
      border-radius: 4px; cursor: pointer; margin-bottom: 2px;
    }
    .layerRow.active { background: #1677ff; color: #fff; }
    .layerRow:not(.active):hover { background: #3a3a3e; }
    .layerRow .eye { width: 20px; text-align: center; cursor: pointer; }
    .layerRow .lName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layerRow .lOps { display: flex; gap: 2px; }
    .layerRow .lOps button { border: none; background: none; color: inherit; cursor: pointer; font-size: 11px; padding: 1px 3px; }
    .layerRow .lOps button:hover { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .layerRow .lBar { width: 100%; height: 2px; background: #555; margin-top: 2px; }
    .layerRow .lBarFill { height: 100%; background: #4fc3f7; }
    .layerDetail {
      padding: 2px 6px 4px; display: flex; gap: 4px; align-items: center;
      font-size: 11px; flex-wrap: wrap;
    }
    .layerDetail input[type=range] { width: 70px; }
    .layerDetail select { font-size: 11px; max-width: 80px; }
    #layerBtns { display: flex; gap: 4px; padding: 6px; border-top: 1px solid #444; }
    #layerBtns button { flex: 1; padding: 4px; font-size: 14px; }
    #status { color: #666; margin-left: auto; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="brush" class="active">画笔 (B)</button>
    <button id="eraser">橡皮 (E)</button>
    <button id="mask">蒙版</button>
    <input type="file" id="tipFile" accept="image/png" hidden />
    <button id="tip" title="纹理笔刷尖">笔尖</button>
    <select id="preset" title="笔刷预设"></select>
    <button id="savePreset" title="保存当前笔刷为预设">存笔</button>
    <input type="color" id="color" value="#000000" title="颜色" />
    <input type="range" id="size" min="1" max="100" value="12" title="笔刷大小" />
    <span id="sizeLabel">12px</span>
    <input type="range" id="stab" min="0" max="98" value="0" title="笔迹稳定器" />
    <span id="stabLabel">稳定0%</span>
    <input type="range" id="tilt" min="0" max="100" value="0" title="笔倾斜灵敏度（tilt 笔刷）" />
    <span id="tiltLabel">倾斜0%</span>
    <select id="blend" title="混合模式"></select>
    <button id="addLayer">+ 图层</button>
    <button id="mergeDown">向下合并</button>
    <button id="flatten">压平</button>
    <button id="undo">撤销</button>
    <button id="redo">重做</button>
    <button id="fit" title="Ctrl+0">适应内容</button>
    <button id="xform" title="Ctrl+T 变换选中/整层">变换</button>
    <button id="copyBtn" title="Ctrl+C">复制</button>
    <button id="pasteBtn" title="Ctrl+V">粘贴</button>
    <span id="xbar" hidden>
      <button id="xRotL">↺15°</button>
      <button id="xRotR">↻15°</button>
      <button id="xScaleDn">－</button>
      <button id="xScaleUp">＋</button>
      <button id="xOk">✓</button>
      <button id="xCancel">✕</button>
    </span>
    <button id="grid" class="active" title="G">网格</button>
    <button id="saveOra" title="分层工程">存工程</button>
    <button id="openOra">开工程</button>
    <input type="file" id="oraFile" accept=".ora" hidden />
    <input type="file" id="svgFile" accept=".svg" hidden />
    <button id="importSvg">SVG</button>
    <button id="export">PNG</button>
    <button id="exportJpg">JPG</button>
    <input type="file" id="import" accept=".png,.jpg,.jpeg,.webp" title="导入图像" />
    <span id="status">加载中…</span>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>

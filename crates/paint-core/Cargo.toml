[package]
name = "paint-core"
description = "平台无关的绘画引擎核心：瓦片/图层/撤销/视口/笔画/引擎骨架"
version.workspace = true
edition.workspace = true

[dependencies]
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
swash = "0.1"
resvg = { version = "0.45", optional = true }
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
image-webp = "0.2"

[features]
default = ["svg"]
svg = ["dep:resvg"]

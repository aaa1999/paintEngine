[package]
name = "paint-desktop"
description = "桌面壳：winit 窗口 + softbuffer 呈现（Windows/macOS/Linux）"
version.workspace = true
edition.workspace = true

[[bin]]
name = "paint"
path = "src/main.rs"

[dependencies]
paint-core = { path = "../paint-core" }
paint-render = { path = "../paint-render" }
winit = "0.30"
softbuffer = "0.4"
rfd = "0.15"

[features]
default = []
# M2.5：GPU 合成（CPU 盖章 + wgpu 合成混合形态）
gpu = ["dep:paint-gpu"]

[dependencies.paint-gpu]
path = "../paint-gpu"
optional = true

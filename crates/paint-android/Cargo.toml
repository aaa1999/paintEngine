[package]
name = "paint-android"
description = "Android 壳：JNI 绑定 + AndroidBitmap 锁像素呈现（cdylib）"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = { workspace = true }
# text(swash 文字光栅化) + svg(resvg 导入) 供文字工具与 SVG 附件使用
paint-core = { path = "../paint-core", default-features = false, features = ["text", "svg"] }
paint-render = { path = "../paint-render" }
jni = "0.21"
